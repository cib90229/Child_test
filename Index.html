<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>錢幣小學堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF6F0; --bg2:#DCEFE6;
    --panel:#FFFFFF;
    --ink:#1C4A44; --ink-soft:#5E847D;
    --gold:#F2B33D; --gold-deep:#D8941E;
    --coral:#FF7A5C; --coral-deep:#E85B3D;
    --mint:#46BE96; --mint-deep:#2E9C78;
    --copper:#CF8A52; --copper-l:#E2A877;
    --silver:#B6C0C8; --silver-l:#D6DDE2;
    --silver10:#9FB0BC; --silver10-l:#C6D2DA;
    --bill:#5FA873; --bill-d:#3F8B57;
    --shadow:0 10px 28px rgba(28,74,68,.14);
    --shadow-sm:0 4px 12px rgba(28,74,68,.12);
    --num:"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --body:"Nunito","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--body);
    background:radial-gradient(1200px 600px at 50% -10%, var(--bg) 0%, var(--bg2) 70%) fixed;
    color:var(--ink); min-height:100vh;
    padding:16px 14px 60px; display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:580px}

  /* Header */
  header{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .logo{font-size:38px; line-height:1; filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
  .titles h1{font-family:var(--num); font-weight:800; font-size:26px; margin:0; letter-spacing:.5px}
  .titles p{margin:2px 0 0; color:var(--ink-soft); font-weight:700; font-size:13.5px}

  /* Level pills */
  .levels{display:flex; gap:8px; margin-bottom:12px}
  .pill{flex:1; border:none; cursor:pointer; font-family:var(--num); font-weight:700;
    font-size:16px; padding:11px 0; border-radius:16px; background:#fff; color:var(--ink-soft);
    box-shadow:var(--shadow-sm); transition:transform .12s, background .2s, color .2s}
  .pill.active{background:var(--gold); color:#5a3c00; transform:translateY(-2px)}
  .pill:active{transform:scale(.96)}

  /* Score row */
  .scorebar{display:flex; gap:10px; margin-bottom:14px}
  .chip{flex:1; background:#fff; border-radius:16px; padding:9px 12px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; gap:7px; font-weight:800; font-size:15px}
  .chip .big{font-family:var(--num); font-size:22px; color:var(--mint-deep)}
  .chip.streak .big{color:var(--coral-deep)}

  /* Card */
  .card{background:var(--panel); border-radius:26px; box-shadow:var(--shadow); padding:20px 18px;
    position:relative; overflow:hidden}
  .badge{display:inline-block; font-family:var(--num); font-weight:700; font-size:13px;
    padding:5px 13px; border-radius:999px; color:#fff; margin-bottom:12px}
  .badge.count{background:var(--mint)} .badge.exch{background:#6c8cff} .badge.make{background:var(--coral)}

  .q{font-family:var(--num); font-weight:700; font-size:23px; line-height:1.45; margin:0 0 14px}
  .q b{color:var(--gold-deep)}

  /* Coins */
  .tray-coins{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    background:linear-gradient(180deg,#FBFCFB,#F1F6F3); border:2px dashed #CFE2D9;
    border-radius:20px; padding:18px 14px; min-height:96px; align-items:center}
  .coin{position:relative; border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-family:var(--num); font-weight:800;
    color:#3a2a08; box-shadow:0 5px 0 rgba(0,0,0,.12), inset 0 2px 4px rgba(255,255,255,.6);
    user-select:none; flex:none}
  .coin .v{font-size:20px; line-height:1} .coin .u{font-size:10px; margin-top:-1px; opacity:.8}
  .c1{width:50px;height:50px;background:radial-gradient(circle at 35% 30%,var(--copper-l),var(--copper))}
  .c5{width:56px;height:56px;background:radial-gradient(circle at 35% 30%,var(--silver-l),var(--silver));color:#33424c}
  .c10{width:64px;height:64px;background:radial-gradient(circle at 35% 30%,var(--silver10-l),var(--silver10));color:#2b3a44}
  .c50{width:74px;height:74px;background:radial-gradient(circle at 35% 30%,#F8CF74,var(--gold))}
  .c100{width:90px;height:58px;border-radius:12px;background:linear-gradient(160deg,#7CC68F,var(--bill));
    color:#0f3a1d; box-shadow:0 5px 0 rgba(0,0,0,.14)}
  .c100 .v{font-size:21px} .c100 .u{font-size:10px}
  .coin.mini{width:34px;height:34px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .coin.mini .v{font-size:13px} .coin.mini .u{display:none}
  .coin.mini.c100{width:48px;height:30px;border-radius:7px}
  .coin.mini.c100 .v{font-size:13px}
  .coin.pop{animation:pop .28s ease}
  @keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1)}}

  /* Think button + panel */
  .thinkbtn{margin-top:14px; width:100%; border:none; cursor:pointer; font-family:var(--num);
    font-weight:700; font-size:18px; padding:13px; border-radius:16px;
    background:#FFF3D6; color:var(--gold-deep); box-shadow:var(--shadow-sm); transition:transform .12s}
  .thinkbtn:active{transform:scale(.98)}
  .thinkbtn.nudge{animation:nudge .5s ease 2}
  @keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .think{margin-top:12px; background:#FFFBF0; border:2px solid #FBE6B6; border-radius:18px;
    padding:14px 14px 12px; display:none}
  .think.show{display:block; animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .step{font-family:var(--num); font-weight:600; font-size:17px; line-height:1.6; padding:9px 4px;
    border-bottom:1px dashed #F0DDA8; display:none}
  .step:last-child{border-bottom:none}
  .step.on{display:block; animation:fade .3s ease}
  .step .h{color:var(--gold-deep); font-weight:800}
  .step .grp{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:6px}
  .seq{color:var(--mint-deep); font-weight:800; letter-spacing:.5px}
  .sub{background:#FFE9B0; border-radius:8px; padding:1px 9px; font-weight:800; color:#7a5400}
  .nextstep{margin-top:10px; display:flex; gap:8px}
  .nextstep button{flex:1; border:none; cursor:pointer; font-family:var(--num); font-weight:700;
    font-size:15px; padding:10px; border-radius:13px}
  .bn{background:var(--gold); color:#5a3c00} .bn:active{transform:scale(.97)}
  .bn:disabled{opacity:.4; cursor:default}

  /* Answer: numpad */
  .answer{margin-top:16px}
  .display{height:62px; border-radius:16px; background:#F1F6F3; border:2px solid #D6E6DE;
    display:flex; align-items:center; justify-content:center; font-family:var(--num);
    font-weight:800; font-size:34px; color:var(--ink); margin-bottom:10px}
  .display .ph{color:#AFC4BB; font-size:20px}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
  .key{border:none; cursor:pointer; font-family:var(--num); font-weight:700; font-size:24px;
    padding:15px 0; border-radius:15px; background:#fff; color:var(--ink); box-shadow:var(--shadow-sm);
    transition:transform .1s}
  .key:active{transform:scale(.94)}
  .key.fn{font-size:18px; background:#EAF1EE; color:var(--ink-soft)}
  .key.ok{background:var(--mint); color:#fff; grid-column:span 1}

  /* Make-amount tray */
  .cashier{margin-top:8px}
  .total{font-family:var(--num); font-weight:800; text-align:center; font-size:20px; margin:6px 0 10px}
  .total .now{font-size:30px; color:var(--mint-deep)} .total .tg{color:var(--gold-deep)}
  .total.over .now{color:var(--coral-deep)}
  .picker{display:grid; grid-template-columns:repeat(auto-fit,minmax(70px,1fr)); gap:9px; margin-top:6px}
  .pick{border:none; cursor:pointer; background:#fff; border-radius:16px; padding:9px 0;
    box-shadow:var(--shadow-sm); display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:transform .1s}
  .pick:active{transform:scale(.95)}
  .pick span{font-family:var(--num); font-weight:700; font-size:13px; color:var(--ink-soft)}
  .makeacts{display:flex; gap:9px; margin-top:12px}
  .makeacts button{flex:1; border:none; cursor:pointer; font-family:var(--num); font-weight:700;
    font-size:17px; padding:13px; border-radius:16px; transition:transform .1s}
  .makeacts button:active{transform:scale(.97)}
  .clr{background:#EAF1EE; color:var(--ink-soft)} .done{background:var(--mint); color:#fff}
  .hint-empty{text-align:center; color:#AFC4BB; font-weight:700; padding:10px; font-size:14px}

  /* Feedback */
  .fb{margin-top:14px; border-radius:18px; padding:14px; text-align:center; font-family:var(--num);
    font-weight:800; font-size:20px; display:none; align-items:center; justify-content:center; gap:10px}
  .fb.show{display:flex; animation:fade .3s ease}
  .fb.good{background:#DDF6EC; color:var(--mint-deep)}
  .fb.bad{background:#FFE7E0; color:var(--coral-deep); font-size:17px}
  .fb .em{font-size:30px}
  .nextq{margin-top:12px; width:100%; border:none; cursor:pointer; font-family:var(--num);
    font-weight:800; font-size:20px; padding:15px; border-radius:18px; background:var(--coral);
    color:#fff; box-shadow:var(--shadow-sm); display:none}
  .nextq.show{display:block} .nextq:active{transform:scale(.98)}

  footer{text-align:center; color:var(--ink-soft); font-weight:700; font-size:12.5px; margin-top:22px; opacity:.7}

  @media (max-width:380px){
    .q{font-size:20px} .key{font-size:21px;padding:13px 0}
    .c50{width:66px;height:66px} .c100{width:80px;height:52px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🐷</div>
    <div class="titles">
      <h1>錢幣小學堂</h1>
      <p>一樣的錢放一起，一堆一堆數，再加起來！</p>
    </div>
  </header>

  <div class="levels" id="levels">
    <button class="pill active" data-lv="easy">簡單</button>
    <button class="pill" data-lv="medium">普通</button>
    <button class="pill" data-lv="hard">挑戰</button>
  </div>

  <div class="scorebar">
    <div class="chip">✅ 答對 <span class="big" id="score">0</span> 題</div>
    <div class="chip streak">🔥 連續 <span class="big" id="streak">0</span> 題</div>
  </div>

  <div class="card">
    <span class="badge count" id="badge">數一數</span>
    <p class="q" id="question">準備中…</p>

    <div id="visual"></div>

    <button class="thinkbtn" id="thinkBtn">想一想 🤔（教我怎麼算）</button>
    <div class="think" id="think"></div>

    <div id="answerArea"></div>

    <div class="fb" id="fb"></div>
    <button class="nextq" id="nextQ">下一題 ▸</button>
  </div>

  <footer>每題都不一樣，答完按「下一題」繼續練習 🎈</footer>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const rnd = n => Math.floor(Math.random()*n);
  const pick = a => a[rnd(a.length)];
  const skip = (d,n)=>{let o=[];for(let i=1;i<=n;i++)o.push(d*i);return o.join('、');};

  // ---------- coin rendering ----------
  function coin(d, mini){
    const cls = mini ? 'coin mini c'+d : 'coin c'+d;
    return `<div class="${cls}"><span class="v">${d}</span><span class="u">元</span></div>`;
  }
  function coinRow(d, n, mini){
    let s=''; for(let i=0;i<n;i++) s+=coin(d,mini); return s;
  }

  // ---------- state ----------
  const state = {
    level:'easy', q:null, score:0, streak:0,
    stepIdx:0, tray:[], answered:false
  };

  const LEVELS = {
    easy:   {coins:[10,5,1],        cap:20,  rel:[[1,5],[1,10],[5,10]],            maxCoins:7},
    medium: {coins:[50,10,5,1],     cap:60,  rel:[[1,5],[1,10],[5,10],[10,50]],   maxCoins:8},
    hard:   {coins:[100,50,10,5,1], cap:120, rel:[[1,5],[1,10],[5,10],[10,50],[5,50],[50,100],[10,100]], maxCoins:9}
  };

  // ---------- generators ----------
  function genCount(L){
    const coins = L.coins;
    for(let tries=0;tries<60;tries++){
      const set=[]; let total=0, cnt=0;
      // pick how many distinct denominations
      const k = 1 + rnd(Math.min(3, coins.length));
      const chosen = [...coins].sort(()=>Math.random()-.5).slice(0,k).sort((a,b)=>b-a);
      for(const d of chosen){
        const max = d===1?5:(d>=50?2:3);
        const n = 1 + rnd(max);
        set.push({d,n}); total+=d*n; cnt+=n;
      }
      if(total>0 && total<=L.cap && cnt<=L.maxCoins && cnt>=2)
        return {type:'count', groups:set.sort((a,b)=>b.d-a.d), answer:total};
    }
    return {type:'count', groups:[{d:10,n:1},{d:1,n:3}], answer:13};
  }

  function genExchange(L){
    const [sm,bg] = pick(L.rel);
    const per = bg/sm; // small coins per big coin
    if(Math.random()<0.5){
      // form A: m個小 = ?個大  (m is multiple of per)
      const k = 1 + rnd(2); // 1~2 big-equivalents
      const m = per*k;
      return {type:'exchange', form:'A', sm, bg, m, total:m*sm, answer:k, per};
    } else {
      // form B: 1個大 = ?個小
      return {type:'exchange', form:'B', sm, bg, answer:per, per};
    }
  }

  function genMake(L){
    const coins = L.coins;
    for(let t=0;t<40;t++){
      const target = 3 + rnd(L.cap-3);
      // ensure reachable (always true since 1元 exists) and not trivial
      if(target>=3) return {type:'make', target, coins:[...coins].sort((a,b)=>b-a)};
    }
    return {type:'make', target:17, coins:[...coins].sort((a,b)=>b-a)};
  }

  function newQuestion(){
    const L = LEVELS[state.level];
    const r = Math.random();
    let q;
    if(r<0.5) q=genCount(L);
    else if(r<0.8) q=genExchange(L);
    else q=genMake(L);
    state.q=q; state.stepIdx=0; state.tray=[]; state.answered=false;
    render();
  }

  // ---------- render ----------
  const badge=$('#badge'), question=$('#question'), visual=$('#visual'),
        think=$('#think'), thinkBtn=$('#thinkBtn'), answerArea=$('#answerArea'),
        fb=$('#fb'), nextQ=$('#nextQ');

  function render(){
    const q=state.q;
    think.className='think'; think.innerHTML='';
    thinkBtn.className='thinkbtn'; thinkBtn.style.display='block';
    fb.className='fb'; fb.innerHTML='';
    nextQ.className='nextq';

    if(q.type==='count') renderCount(q);
    else if(q.type==='exchange') renderExchange(q);
    else renderMake(q);
  }

  // ----- 數一數 -----
  function renderCount(q){
    badge.className='badge count'; badge.textContent='數一數';
    question.innerHTML='桌上有這些錢，<b>一共是幾元</b>呢？';
    // shuffle display
    let coins=[]; q.groups.forEach(g=>{for(let i=0;i<g.n;i++)coins.push(g.d);});
    coins.sort(()=>Math.random()-.5);
    visual.innerHTML='<div class="tray-coins">'+coins.map(d=>coin(d,false)).join('')+'</div>';
    buildNumpad();
  }

  // ----- 換錢 -----
  function renderExchange(q){
    badge.className='badge exch'; badge.textContent='換錢';
    if(q.form==='A'){
      question.innerHTML=`<b>${q.m} 個 ${q.sm}元</b> 可以換成 <b>幾個 ${q.bg}元</b>？`;
      visual.innerHTML='<div class="tray-coins">'+coinRow(q.sm,q.m,false)+'</div>';
    }else{
      question.innerHTML=`<b>1 個 ${q.bg}元</b> 可以換成 <b>幾個 ${q.sm}元</b>？`;
      visual.innerHTML='<div class="tray-coins">'+coin(q.bg,false)+'</div>';
    }
    buildNumpad();
  }

  // ----- 湊錢 -----
  function renderMake(q){
    badge.className='badge make'; badge.textContent='湊錢';
    question.innerHTML=`要買 <b>${q.target} 元</b> 的東西🍬，請放入剛好 <b>${q.target} 元</b>。`;
    answerArea.innerHTML='';
    visual.innerHTML='';
    buildCashier();
  }

  // ---------- numpad ----------
  let typed='';
  function buildNumpad(){
    typed='';
    answerArea.innerHTML=`
      <div class="answer">
        <div class="display" id="disp"><span class="ph">輸入答案（元）</span></div>
        <div class="pad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
          <button class="key fn" data-k="del">⌫</button>
          <button class="key" data-k="0">0</button>
          <button class="key ok" data-k="ok">確定</button>
        </div>
      </div>`;
    answerArea.querySelectorAll('.key').forEach(b=>{
      b.addEventListener('click',()=>{
        const k=b.dataset.k;
        if(state.answered && k!=='ok') return;
        if(k==='del'){typed=typed.slice(0,-1);}
        else if(k==='ok'){checkNum();return;}
        else if(typed.length<4){typed+=k;}
        const d=$('#disp');
        d.innerHTML = typed==='' ? '<span class="ph">輸入答案（元）</span>' : typed;
      });
    });
  }
  function checkNum(){
    if(typed===''){nudgeThink();return;}
    const val=parseInt(typed,10);
    if(val===state.q.answer) onCorrect();
    else onWrong('再數數看～ 試試按「想一想」一步一步算！');
  }

  // ---------- cashier (make amount) ----------
  function buildCashier(){
    const q=state.q;
    answerArea.innerHTML=`
      <div class="cashier">
        <div class="tray-coins" id="trayBox"><div class="hint-empty">點下面的錢幣放進來 👇</div></div>
        <div class="total" id="totalLine">目前 <span class="now">0</span> 元 ／ 目標 <span class="tg">${q.target}</span> 元</div>
        <div class="picker">
          ${q.coins.map(d=>`<button class="pick" data-d="${d}">${coin(d,true)}<span>放 ${d}元</span></button>`).join('')}
        </div>
        <div class="makeacts">
          <button class="clr" id="clrBtn">清空</button>
          <button class="done" id="doneBtn">完成 ✓</button>
        </div>
      </div>`;
    answerArea.querySelectorAll('.pick').forEach(b=>{
      b.addEventListener('click',()=>{ if(state.answered)return; state.tray.push(+b.dataset.d); paintTray(true); });
    });
    $('#clrBtn').addEventListener('click',()=>{ if(state.answered)return; state.tray=[]; paintTray(false); });
    $('#doneBtn').addEventListener('click',checkMake);
    paintTray(false);
  }
  function paintTray(pop){
    const box=$('#trayBox'); const sum=state.tray.reduce((a,b)=>a+b,0);
    if(state.tray.length===0){box.innerHTML='<div class="hint-empty">點下面的錢幣放進來 👇</div>';}
    else{
      box.innerHTML=state.tray.map((d,i)=>`<div class="coin c${d} ${pop&&i===state.tray.length-1?'pop':''}" data-i="${i}"><span class="v">${d}</span><span class="u">元</span></div>`).join('');
      box.querySelectorAll('.coin').forEach(c=>c.addEventListener('click',()=>{
        if(state.answered)return; state.tray.splice(+c.dataset.i,1); paintTray(false);
      }));
    }
    const line=$('#totalLine');
    line.querySelector('.now').textContent=sum;
    line.className = sum>state.q.target ? 'total over' : 'total';
  }
  function checkMake(){
    const sum=state.tray.reduce((a,b)=>a+b,0); const t=state.q.target;
    if(sum===t) onCorrect();
    else if(sum<t) onWrong(`還差 ${t-sum} 元，再放一點點！`);
    else onWrong(`超過了 ${sum-t} 元，點錢幣可以拿掉喔。`);
  }

  // ---------- think / guided steps ----------
  thinkBtn.addEventListener('click',()=>{
    if(think.classList.contains('show')){ think.className='think'; thinkBtn.textContent='想一想 🤔（教我怎麼算）'; return; }
    buildSteps(); think.className='think show'; thinkBtn.textContent='收起提示 ▲';
  });

  function buildSteps(){
    const q=state.q; let steps=[];
    if(q.type==='count') steps=stepsCount(q);
    else if(q.type==='exchange') steps=stepsExchange(q);
    else steps=stepsMake(q);
    state.stepIdx=0;
    think.innerHTML = steps.map((h,i)=>`<div class="step${i===0?' on':''}">${h}</div>`).join('')
      + `<div class="nextstep"><button class="bn" id="nextStep">下一步 ▸</button></div>`;
    const total=steps.length;
    const nb=$('#nextStep');
    nb.addEventListener('click',()=>{
      state.stepIdx++;
      const all=think.querySelectorAll('.step');
      if(state.stepIdx<total){ all[state.stepIdx].classList.add('on'); all[state.stepIdx].scrollIntoView({block:'nearest',behavior:'smooth'}); }
      if(state.stepIdx>=total-1){ nb.textContent='看完了，自己算算看！'; nb.disabled=true; }
    });
  }

  function stepsCount(q){
    const steps=[];
    steps.push(`<span class="h">第一步</span>：把<b>一樣的錢</b>放在一起 🧺
      <div class="grp">${q.groups.map(g=>`<span style="display:inline-flex;gap:4px;background:#fff;padding:5px 8px;border-radius:12px">${coinRow(g.d,g.n,true)}</span>`).join('')}</div>`);
    q.groups.forEach(g=>{
      const sub=g.d*g.n;
      steps.push(`<span class="h">${g.d}元有 ${g.n} 個</span>：一個一個數 → <span class="seq">${skip(g.d,g.n)}</span>　就是 <span class="sub">${sub} 元</span>`);
    });
    if(q.groups.length>1){
      const parts=q.groups.map(g=>g.d*g.n);
      steps.push(`<span class="h">最後一步</span>：把每一堆<b>加起來</b><br>${parts.join(' ＋ ')} ＝ <span class="sub">${q.answer} 元</span> 🎉`);
    } else {
      steps.push(`所以一共是 <span class="sub">${q.answer} 元</span> 🎉`);
    }
    return steps;
  }

  function stepsExchange(q){
    const steps=[];
    if(q.form==='A'){
      steps.push(`<span class="h">第一步</span>：先算 ${q.m} 個 ${q.sm}元 是多少錢<br><span class="seq">${skip(q.sm,Math.min(q.m,10))}${q.m>10?'…':''}</span> ＝ <span class="sub">${q.total} 元</span>`);
      steps.push(`<span class="h">第二步</span>：看看 ${q.total} 元 裡面有<b>幾個 ${q.bg}元</b><br>用 ${q.bg} 一直加：<span class="seq">${skip(q.bg,q.answer)}</span>`);
      steps.push(`<span class="h">答案</span>：可以換 <span class="sub">${q.answer} 個 ${q.bg}元</span> 🎉`);
    }else{
      steps.push(`<span class="h">第一步</span>：1 個 ${q.bg}元 就是 <span class="sub">${q.bg} 元</span>`);
      steps.push(`<span class="h">第二步</span>：用 ${q.sm}元 一個一個換，數到 ${q.bg}<br><span class="seq">${skip(q.sm,q.answer)}</span>`);
      steps.push(`<span class="h">答案</span>：1 個 ${q.bg}元 ＝ <span class="sub">${q.answer} 個 ${q.sm}元</span> 🎉`);
    }
    return steps;
  }

  function stepsMake(q){
    const steps=[`<span class="h">小撇步</span>：先放<b>大的錢幣</b>，比較快！💡`];
    let left=q.target, running=0, lines=[];
    q.coins.forEach(d=>{
      if(left<=0) return;
      const n=Math.floor(left/d);
      if(n>0){ left-=d*n; const before=running; running+=d*n;
        lines.push(`放 <b>${n} 個 ${d}元</b>　${before} ＋ ${d*n} ＝ <span class="sub">${running} 元</span>`);
      }
    });
    lines.forEach(l=>steps.push(l));
    steps.push(`湊到 <span class="sub">${q.target} 元</span> 了！🎉<br><span style="color:var(--ink-soft);font-size:14px">（這只是一種方法，你也可以用別的錢幣湊喔～）</span>`);
    return steps;
  }

  // ---------- feedback ----------
  const PRAISE=['答對了！','太棒了！','你好厲害！','完全正確！','數學小高手！'];
  function onCorrect(){
    if(state.answered) return;
    state.answered=true; state.score++; state.streak++;
    $('#score').textContent=state.score; $('#streak').textContent=state.streak;
    fb.className='fb good show';
    fb.innerHTML=`<span class="em">🐷🎉</span> ${pick(PRAISE)}`;
    nextQ.className='nextq show'; thinkBtn.style.display='none';
    nextQ.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function onWrong(msg){
    state.streak=0; $('#streak').textContent=0;
    fb.className='fb bad show';
    fb.innerHTML=`<span class="em">🤔</span> ${msg}`;
    nudgeThink();
  }
  function nudgeThink(){
    if(thinkBtn.style.display!=='none'){ thinkBtn.classList.remove('nudge'); void thinkBtn.offsetWidth; thinkBtn.classList.add('nudge'); }
  }

  nextQ.addEventListener('click',newQuestion);

  // ---------- levels ----------
  $('#levels').addEventListener('click',e=>{
    const b=e.target.closest('.pill'); if(!b)return;
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
    b.classList.add('active'); state.level=b.dataset.lv; newQuestion();
  });

  // ---------- go ----------
  newQuestion();
})();
</script>
</body>
</html>
